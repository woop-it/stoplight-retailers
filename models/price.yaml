title: Price
type: object
description: Corresponds to the price
examples:
  - taxExcludedAmount: 17.2
    taxIncludedAmount: 20.64
    taxAmount: 3.44
    currency: EUR
  - error: Timeout after 50ms
required:
  - taxExcludedAmount
  - currency
properties:
  taxExcludedAmount:
    type: number
    description: Indicative value of the price without taxes
  taxIncludedAmount:
    type: number
    description: Indicative value of the price with taxes
  taxAmount:
    type: number
    description: Indicative value of the taxes amount
  currency:
    $ref: ./currency.yaml
  error:
    type: string
    x-stoplight:
      id: eu3vjjnentqoc
    description: This attribute is returned only if the timeout exceeded the value specified in `price.timeout` in the input payload
